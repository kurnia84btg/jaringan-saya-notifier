name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jaringan-saya-notifier
          path: app/build/outputs/apk/release/*.apk

      - name: Terbitkan sebagai Release (unduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          TAG="v${VER}-build${{ github.run_number }}"
          FILE="JaringanSayaNotifier-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --title "Jaringan Saya Notifier ${TAG}" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}." \
            --latest
